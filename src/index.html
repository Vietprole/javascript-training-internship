<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Tracking</title>
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <main>
      <!--* Main Page -->
      <section class="dashboard">
        <div class="search-add-container">
          <div class="search-bar" tabindex="0">
            <div class="icon-wrapper">
              <img src="./assets/icons/search-icon.svg" alt="Search customer icon" />
            </div>
            <input type="text" class="search-input" placeholder="Search..." />
          </div>
          <button class="button-primary add-button" type="button">
            <div class="icon-wrapper">
              <img src="./assets/icons/add-icon.svg" alt="Add customer icon" />
            </div>
            Add customer
          </button>
        </div>
        <div class="table">
          <!--* Loading indicator -->
          <div class="loader-container">
            <div class="loader"></div>
          </div>
          <header class="table-header">
            <div class="name-header">
              <h2>Name</h2>
              <div class="sort-button icon-wrapper">
                <img src="./assets/icons/sort-default-icon.svg" alt="Sort icon" />
              </div>
            </div>
            <h2 class="description-header">Description</h2>
            <h2 class="status-header">Status</h2>
            <h2 class="rate-header">Rate</h2>
            <h2 class="balance-header">Balance</h2>
            <h2 class="deposit-header">Deposit</h2>
          </header>
          <div class="table-body"></div>
        </div>
      </section>
    </main>
    <!--* Action Menu -->
    <div class="action-menu"></div>
    <!--* Modal Overlay -->
    <div class="modal-overlay"></div>
    <!--* Customer Modal will be created in JS -->
    <div class="modal customer-modal"></div>
    <!--* View Customer Modal will be created in JS -->
    <div class="modal view-customer-modal"></div>
    <!--* Delete confirmation modal will be created by JS-->
    <div class="modal delete-confirmation-modal"></div>
    <script src="./js/main.js" type="module"></script>
  </body>
</html>
